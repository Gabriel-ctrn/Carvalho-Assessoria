<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Loading…</title>
    <style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
  </head>
  <body>
    <div>
      <p>Carregando a aplicação…</p>
      <p style="opacity:.7;font-size:.9rem">Se não carregar automaticamente, <a href="/">clique aqui</a>.</p>
    </div>
    <script>
      // Try to load the SPA index and inject it so the client-side router can handle the current path.
      // This preserves the original URL (no redirect) which fixes deep-linking on static hosts like GitHub Pages.
      (function(){
        var indexPath = '/index.html';
        // Attempt to fetch index.html and replace document content with it
        fetch(indexPath).then(function(response){
          if (!response.ok) throw new Error('index not found');
          return response.text();
        }).then(function(html){
          // Write the fetched index.html into the document
          document.open();
          document.write(html);
          document.close();
        }).catch(function(){
          // Fallback: navigate to root
          location.replace('/');
        });
      })();
    </script>
  </body>
</html>
